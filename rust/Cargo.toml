[package]
name = "rust_lib_ncode"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
tokio = { version = "1.38", features = ["full"] }
ignore = "0.4"            # Escaneo ultrarrápido de archivos respetando .gitignore
walkdir = "2.5"           # Recorrido de directorios

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
